# Render Blueprint: deploys "my little corner" as a Node web service. The database is a Supabase
# (Free plan) PostgreSQL project, connected through Supabase's Session pooler. See docs/DATABASE.md.
#
# The server (server/index.ts) serves the app from dist/ and the /api routes from the same origin.
# Diary pages are encrypted in each person's browser before they're sent, so the database only
# holds ciphertext. Each person signs in to their own account and only ever gets their own diary.
#
# IMPORTANT before switching an existing deployment, read README → "Moving from the static site".
services:
  - type: web
    name: my-little-corner-app
    runtime: node
    plan: free  # sleeps after ~15 min idle; first visit after that takes ~1 min. "starter" is always on (paid).
    # Closest Render region to the Supabase project (South Asia, Mumbai). Keep the two close: every save is a round trip.
    region: singapore
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run serve
    healthCheckPath: /api/health
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_ENV
        value: production
      # Supabase → Connect → "Session pooler" connection string (port 5432), with your database
      # password filled in. A secret: set it in the Render dashboard, never in the repo, never as VITE_*.
      - key: DATABASE_URL
        sync: false
      # Supabase → Database settings → SSL configuration → download the CA certificate, and paste
      # the file's whole contents here. Without it the server refuses to connect (no unverified TLS).
      - key: DATABASE_CA_CERT
        sync: false
      # Open database connections. Keep small: Supabase Free's pooler allows a limited number.
      - key: DB_POOL_MAX
        value: "5"
      # "read-only" only while moving the database (see docs/DATABASE.md); otherwise leave empty.
      - key: MAINTENANCE_MODE
        value: ""
      # Set to "false" to stop new accounts being created (e.g. once everyone you invited has one).
      - key: ALLOW_SIGNUPS
        value: "true"
      # How long overwritten/deleted (still encrypted) pages are kept for recovery.
      - key: HISTORY_DAYS
        value: "30"
      # Optional: the Google OAuth client ID that turns on Google Drive backups (see README).
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
