<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#f8e6e6" />
    <meta name="description" content="A private little corner to write in." />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>my little corner</title>
  </head>
  <body>
    <div id="root">
      <!-- Shown only if the app's code can't load (e.g. index.html opened directly). React replaces it. -->
      <div style="font-family: system-ui, sans-serif; max-width: 34rem; margin: 18vh auto; padding: 0 1.25rem; color: #453b3d; line-height: 1.6; text-align: center">
        <p style="font-size: 2rem; margin: 0">🤍</p>
        <h1 style="font-size: 1.4rem; margin: 0.5rem 0">Your little corner is still getting ready…</h1>
        <p>If this message doesn’t go away, the diary was probably opened as a file instead of through its little server.</p>
        <p>Open a terminal in the diary folder, run <code>npm run dev</code>, then visit <strong>http://localhost:5173</strong>.<br />(Or double-click <code>start-diary.bat</code>.)</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
